# Every node loads this one file and reads its own section.
/**:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /diff_drive_controller/odom
    # Nav2's 20 ms default aborts goals whenever a busy host delays a planner acknowledgement.
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    odom_topic: /diff_drive_controller/odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.45
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.45
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        [
          RotateToGoal,
          Oscillation,
          BaseObstacle,
          GoalAlign,
          PathAlign,
          PathDist,
          GoalDist,
        ]
      BaseObstacle.scale: 0.05
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.3
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.3
      PathDist.scale: 24.0
      GoalDist.scale: 16.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.57
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /robot/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 11.5
          raytrace_max_range: 12.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.57
      update_frequency: 2.0
      publish_frequency: 1.0
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /robot/scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 11.5
          raytrace_max_range: 12.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

controller_manager:
  ros__parameters:
    # Wheel transforms follow this rate; with odometry and SLAM it keeps /tf under Lichtblick's 60 Hz alert.
    update_rate: 20
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: [left_wheel]
    right_wheel_names: [right_wheel]
    # Wheel geometry of scene.ts.
    wheel_separation: 0.9
    wheel_radius: 0.22
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    # Integrate measured wheel velocities for encoder odometry.
    position_feedback: false
    open_loop: false
    cmd_vel_timeout: 0.5
    publish_rate: 20.0
    # Uncalibrated dead reckoning: trust planar pose and yaw a little, nothing else.
    pose_covariance_diagonal:
      [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal:
      [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]

slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /robot/scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 12.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    transform_publish_period: 0.1

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names:
      [controller_server, planner_server, behavior_server, bt_navigator]

# slam_toolbox creates no bond, so it has its own manager with the bond check off.
lifecycle_manager_slam:
  ros__parameters:
    autostart: true
    bond_timeout: 0.0
    node_names: [slam_toolbox]

foxglove_bridge:
  ros__parameters:
    address: 127.0.0.1
    send_buffer_limit: 100000000
    # Only what the viewer layout uses. Everything else is noise there: the 120 Hz clock trips
    # Lichtblick's rate alert, and Nav2 and SLAM services disagree on the Marker schema.
    topic_whitelist:
      [
        "^/tf$",
        "^/tf_static$",
        "^/map$",
        "^/robot/.*",
        "^/sim/score$",
        "^/sim/evaluation$",
        "^/diff_drive_controller/.*",
        "^/plan$",
        "^/local_plan$",
        "^/local_costmap/costmap$",
        "^/global_costmap/costmap$",
        "^/goal_pose$",
        "^/initialpose$",
        "^/clicked_point$",
      ]
    service_whitelist: ["^$"]
    param_whitelist: ["^$"]
