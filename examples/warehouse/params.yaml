# Every node loads this one file and reads its own section.
/**:
  ros__parameters:
    enable_stamped_cmd_vel: true

bt_navigator:
  ros__parameters:
    robot_base_frame: base_footprint
    odom_topic: /diff_drive_controller/odom
    # Nav2's 20 ms default aborts goals whenever a busy host delays a planner acknowledgement.
    default_server_timeout: 1000
    wait_for_service_timeout: 5000

controller_server:
  ros__parameters:
    odom_topic: /diff_drive_controller/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 20.0
    goal_checker:
      yaw_goal_tolerance: 0.3
    FollowPath:
      max_vel_x: 0.45
      max_vel_theta: 0.8
      max_speed_xy: 0.45
      acc_lim_x: 0.8
      acc_lim_theta: 1.5
      decel_lim_x: -0.8
      decel_lim_theta: -1.5
      vx_samples: 15
      vy_samples: 1
      linear_granularity: 0.05
      transform_tolerance: 0.3
      trans_stopped_velocity: 0.05
      critics:
        [
          RotateToGoal,
          Oscillation,
          BaseObstacle,
          GoalAlign,
          PathAlign,
          PathDist,
          GoalDist,
        ]
      BaseObstacle.scale: 0.05
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.3
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.3
      PathDist.scale: 24.0
      GoalDist.scale: 16.0
      RotateToGoal.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      resolution: 0.05
      robot_radius: 0.57
      publish_frequency: 2.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /robot/scan
          clearing: true
          obstacle_max_range: 11.5
          raytrace_max_range: 12.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.57
      update_frequency: 2.0
      track_unknown_space: true
      obstacle_layer:
        observation_sources: scan
        scan:
          topic: /robot/scan
          clearing: true
          obstacle_max_range: 11.5
          raytrace_max_range: 12.0
          max_obstacle_height: 2.0
      inflation_layer:
        inflation_radius: 0.8
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.25
      use_astar: true

behavior_server:
  ros__parameters:
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

controller_manager:
  ros__parameters:
    # Wheel transforms follow this rate; with odometry and SLAM it keeps /tf under Lichtblick's 60 Hz alert.
    update_rate: 20
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: [left_wheel]
    right_wheel_names: [right_wheel]
    # Wheel geometry of scene.ts.
    wheel_separation: 0.9
    wheel_radius: 0.22
    base_frame_id: base_footprint
    # Integrate measured wheel velocities for encoder odometry.
    position_feedback: false
    publish_rate: 20.0
    # Uncalibrated dead reckoning: trust planar pose and yaw a little, nothing else.
    pose_covariance_diagonal:
      [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal:
      [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]

slam_toolbox:
  ros__parameters:
    scan_topic: /robot/scan
    max_laser_range: 12.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    transform_publish_period: 0.1

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names:
      [controller_server, planner_server, behavior_server, bt_navigator]

# slam_toolbox creates no bond, so it has its own manager with the bond check off.
lifecycle_manager_slam:
  ros__parameters:
    autostart: true
    bond_timeout: 0.0
    node_names: [slam_toolbox]
