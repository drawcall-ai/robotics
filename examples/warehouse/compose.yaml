services:
  ros:
    build: ./ros
    init: true
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      ROS_DOMAIN_ID: "17"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 9090), 2).close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
